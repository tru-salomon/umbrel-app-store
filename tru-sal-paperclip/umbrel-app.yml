description: >-
  Personal patched build of Paperclip 2026.1106.0. It adds server-side renewal
  of Claude subscription OAuth tokens (upstream PR #15319), so Claude
  subscription connections keep working past the 8-hour token expiry.


  Paperclip is a self-hosted control center for running AI agents like a team.
  Create a company, set a goal, hire agents with roles and reporting lines, then
  review their plans, approve important decisions, and track their work from one
  dashboard.


  Paperclip does not include an AI model by itself. Connect your own provider
  keys or subscriptions. Provider usage may incur costs, so set budgets before
  letting agents run unattended.
